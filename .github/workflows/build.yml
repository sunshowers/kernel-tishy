---
name: Build Tishy Kernel

# Builds an OGC (OpenGamingCollective) Fedora kernel with the tishy HDMI FRL +
# VRR patches layered on top, then packages the RPMs into a FROM-able OCI image
# consumed by the tishy-deck build (see ../tishy/Containerfile.deck).
#
# The build core is build.sh, shared with local builds (build-local.sh), so CI
# and local builds run the exact same steps. The OGC kernel version is read from
# the KERNEL_VERSION file unless overridden via workflow_dispatch.

on:
  push:
    branches:
      - main
    tags:
      - "*-frl*"
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      version:
        description: "OGC kernel version to build (e.g. 7.1.3-ogc3). Defaults to the KERNEL_VERSION file."
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-rpm:
    name: Build kernel RPMs
    strategy:
      fail-fast: false
      matrix:
        fedora_version: [43]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write
      attestations: write

    container:
      image: fedora:${{ matrix.fedora_version }}
      volumes:
        - /usr:/usr-host
        - /opt:/opt-host
      options: --privileged

    steps:
      - name: Maximize build space
        run: |
          df -h
          rm -rf /usr-host/share/dotnet
          rm -rf /usr-host/share/swift
          rm -rf /usr-host/share/java
          rm -rf /usr-host/local/lib/android
          rm -rf /opt-host/ghc
          rm -rf /opt-host/hostedtoolcache
          rm -rf /opt-host/az
          df -h

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build kernel RPMs
        env:
          OGC_VERSION: ${{ github.event.inputs.version }}
          BUILDNUM: ${{ github.run_number }}
        run: bash build.sh

      - name: Attest RPM provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "rpms/kernel-*.rpm"

      - name: Upload kernel RPMs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fc${{ matrix.fedora_version }}-x86_64
          path: rpms/*.rpm
          compression-level: 7

  push-oci:
    name: Package and push OCI image
    needs: build-rpm
    strategy:
      fail-fast: false
      matrix:
        fedora_version: [43]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download kernel RPMs
        uses: actions/download-artifact@v4
        with:
          name: kernel-fc${{ matrix.fedora_version }}-x86_64
          path: rpms

      - name: Build OCI image
        id: oci
        run: |
          RPM_DIR="$(pwd)/rpms" FEDORA_VERSION="${{ matrix.fedora_version }}" \
            buildah unshare ./oci.sh

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push OCI image
        id: push
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          REPO="${REPO,,}"
          VERSIONED="${GITHUB_REF_NAME//\//-}-f${{ matrix.fedora_version }}-x86_64"
          podman push --digestfile .oci-digest \
            "localhost/kernel-f${{ matrix.fedora_version }}" \
            "docker://${REPO}:${VERSIONED}"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat .oci-digest)" >> "$GITHUB_OUTPUT"

      - name: Push latest tag
        run: |
          REPO="${{ steps.push.outputs.repo }}"
          podman push \
            "localhost/kernel-f${{ matrix.fedora_version }}" \
            "docker://${REPO}:latest-f${{ matrix.fedora_version }}-x86_64"

      - name: Attest OCI provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: "ghcr.io/${{ github.repository }}"
          subject-digest: "${{ steps.push.outputs.digest }}"
          push-to-registry: true
